name: 打包上传 TestFlight
# 触发：修改 ci/release.txt 并推送
on:
  push:
    branches: [main]
    paths: [ci/release.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 选择最新 Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: 解密密钥
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
          ASC_B64: ${{ secrets.ASC_KEY_ENC_B64 }}
          DIST_B64: ${{ secrets.DIST_KEY_ENC_B64 }}
        run: source ci/decrypt.sh
      - name: 导入发布证书和描述文件
        run: |
          K="$RUNNER_TEMP/keys"
          openssl x509 -inform der -in ci/dist.cer -out "$K/dist.pem"
          P12PASS=$(openssl rand -hex 12)
          openssl pkcs12 -export -legacy -inkey "$DIST_KEY" -in "$K/dist.pem" -out "$K/dist.p12" -passout pass:$P12PASS 2>/dev/null \
            || openssl pkcs12 -export -inkey "$DIST_KEY" -in "$K/dist.pem" -out "$K/dist.p12" -passout pass:$P12PASS
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS=$(openssl rand -hex 12)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$K/dist.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            for f in ci/profiles/*.mobileprovision; do u=$(security cms -D -i "$f" | plutil -extract UUID raw -); cp "$f" "$d/$u.mobileprovision"; done
          done
      - name: 生成工程
        working-directory: iOS
        run: brew install xcodegen && xcodegen generate
      - name: 打包（Archive）
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1 )) \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: 导出并上传到 App Store Connect
        working-directory: iOS
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>AppStore $BUNDLE_ID</string>
              <key>$BUNDLE_ID.widget</key><string>AppStore $BUNDLE_ID.widget</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log | tail -40
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log
      - name: 保存日志
        if: always()
        working-directory: iOS
        run: |
          mkdir -p /tmp/cilog
          for f in archive.log export.log; do [ -f $f ] || continue; grep -iE "error|warning: .*(sign|provision)" $f | sort -u | head -200 > /tmp/cilog/$f.errors.txt; tail -150 $f > /tmp/cilog/$f.tail.txt; done
          cd /tmp/cilog; echo "$GITHUB_SHA ${{ job.status }}" > sha.txt
          git init -q -b ci-log-testflight; git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "testflight log $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log-testflight
