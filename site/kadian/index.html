<h2>常见问题</h2>
<p><b>数据保存在哪里？</b><br>全部保存在你的手机上，我们没有服务器。可以在 App 里导出备份。</p>
<p><b>会员怎么恢复？</b><br>在会员页点「恢复购买」，使用同一个 Apple ID 即可找回。</p>
<p><b>怎么取消自动续费？</b><br>iPhone「设置 → Apple ID → 订阅」里关闭即可。</p>
<h2>联系我们</h2>
<p>在 App 里点「意见反馈」，我们会尽快回复。</p>
