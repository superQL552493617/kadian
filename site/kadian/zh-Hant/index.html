<h1>卡點 · 幫助與支持</h1>
<p>毫秒對時，搶票卡點不慌</p>
<h2>常見問題</h2>
<p><b>資料儲存在哪裡？</b><br>全部儲存在你的手機上，我們沒有伺服器。可以在 App 裡匯出備份。</p>
<p><b>會員怎麼恢復？</b><br>在會員頁點「恢復購買」，使用同一個 Apple ID 即可找回。</p>
<p><b>怎麼取消自動續費？</b><br>iPhone「設定 → Apple ID → 訂閱」裡關閉即可。</p>
<h2>聯絡我們</h2>
<p>在 App 裡點「意見反饋」，我們會盡快回復。</p>
